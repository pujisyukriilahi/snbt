name: Update SNBT Readiness Recommendations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update readiness recommendations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("let min=max<=4?2:max<=8?4:max<=16?8:max<=28?16:max<=40?28:40;", "let min=4;")
          s = s.replace("<div class=\"status checkpoint\" id=\"checkpoint\"></div><div class=\"note\">", "<div class=\"status checkpoint\" id=\"checkpoint\"></div><div class=\"status\" id=\"selfStudy\"></div><div class=\"note\">")
          s = s.replace("$('checkpoint').innerHTML=a.noGap?'<b>Langkah berikutnya:</b> lakukan Try Out. Jika ada area yang tertinggal, gunakan <b>SNBT TO GAP CHECK</b>.':'<b>Evaluasi:</b> cek perkembangan secara berkala. Bila kebutuhan berubah, Study Plan dapat disesuaikan kembali. Setelah hasil Try Out tersedia, gunakan <b>SNBT TO GAP CHECK</b>.';", "$('checkpoint').innerHTML=a.noGap?'<b>Langkah berikutnya:</b> lakukan Try Out. Jika ada area yang tertinggal, gunakan <b>SNBT TO GAP CHECK</b>.':'<b>Evaluasi:</b> cek perkembangan secara berkala. Bila kebutuhan berubah, Study Plan dapat disesuaikan kembali. Setelah hasil Try Out tersedia, gunakan <b>SNBT TO GAP CHECK</b>.';$('selfStudy').innerHTML=a.noGap||a.range[1]<=4?'<b>📘 Belajar mandiri:</b> lengkapi latihan dengan <b>eBook Soal SNBT Tutorin</b> sebagai tambahan belajar mandiri. Gunakan untuk latihan soal, pembahasan, dan evaluasi kesalahan secara rutin.':'<b>📘 Tambahan belajar mandiri:</b> kamu juga dapat menggunakan <b>eBook Soal SNBT Tutorin</b> untuk memperbanyak latihan di luar sesi pendampingan.';")
          s = s.replace("const lines=['SNBT READINESS CHECK — TUTORIN'", "const lines=['SNBT READINESS CHECK — TUTORIN'")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Improve readiness session minimum and self-study recommendation'
          git push
